<!DOCTYPE html>
<!-- Fragment dùng chung (≈ app/views/shared/_*.html.erb). Không controller nào render file này trực tiếp.
     Gọi: th:replace="~{fragments/layout :: head('Tiêu đề')}" -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Employee Management'">Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- sec:authorize (thymeleaf-extras-springsecurity6) ≈ "if user_signed_in?" / "if can?" trong view Rails.
     Chỉ ẩn link cho gọn giao diện; quyền thật sự vẫn do SecurityConfig chặn ở server. -->
<header th:fragment="header" class="site-header">
    <strong>Employee Management</strong>
    <nav sec:authorize="isAuthenticated()">
        <a th:href="@{/employees/list}">Danh sách</a>
        <a th:href="@{/employees/add}" sec:authorize="hasRole('ADMIN')">+ Thêm nhân viên</a>
        <a th:href="@{/employees/search}">Tìm kiếm</a>
        <a th:href="@{/employees/statistics}">Thống kê</a>
    </nav>
    <div class="user-box" sec:authorize="isAuthenticated()">
        <span sec:authentication="name">admin</span>
        <span class="role" sec:authorize="hasRole('ADMIN')">ADMIN</span>
        <span class="role" sec:authorize="!hasRole('ADMIN')">USER</span>
        <!-- Đăng xuất phải là POST (kèm _csrf tự chèn) để trang khác không lừa trình duyệt gọi GET /logout -->
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit">Đăng xuất</button>
        </form>
    </div>
    <nav sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}">Đăng nhập</a>
        <a th:href="@{/register}">Đăng ký</a>
    </nav>
</header>

<!-- Bảng nhân viên, dùng lại ở trang list và search. Tham số: employees (List<EmployeeResponse>) -->
<table th:fragment="employeeTable(employees)">
    <thead>
    <tr><th>Mã</th><th>Tên</th><th>Email</th><th>Phòng ban</th></tr>
    </thead>
    <tbody>
    <tr th:each="e : ${employees}">
        <td th:text="${e.code}">EMP0001</td>
        <td th:text="${e.name}">Nguyễn Văn An</td>
        <td th:text="${e.email}">an@example.com</td>
        <td th:text="${e.departmentName}">IT</td>
    </tr>
    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="4" class="empty">Không có nhân viên nào.</td>
    </tr>
    </tbody>
</table>

<footer th:fragment="footer" class="site-footer">
    <p>&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> Employee Management System</p>
</footer>

</body>
</html>
